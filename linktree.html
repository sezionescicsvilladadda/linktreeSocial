<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sezione Sci CS Villa d'Adda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #7cc4ea;
    --sky-mid: #bfe3f5;
    --sky-bottom: #f4fbff;
    --navy: #123a5c;
    --ice: #1f97cf;
    --ice-soft: #4d7999;
    --frost: #123a5c;
    --snow: #ffffff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Work Sans', sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, #ffe9b0 0%, rgba(255,233,176,0) 22%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%);
    color: var(--frost);
    min-height: 100%;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  /* ---- Falling snow (single orchestrated ambient effect) ---- */
  .snow {
    position: fixed;
    top: -10px;
    color: rgba(18,58,92,0.55);
    text-shadow: 0 1px 2px rgba(255,255,255,0.9);
    user-select: none;
    pointer-events: none;
    animation: fall linear infinite;
    z-index: 1;
  }
  @keyframes fall {
    0%   { transform: translateY(-5vh) translateX(0); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(105vh) translateX(20px); opacity: 0.2; }
  }
  @media (prefers-reduced-motion: reduce) {
    .snow { animation: none; display: none; }
  }

  /* ---- Mountain silhouette anchored to the bottom of the viewport ---- */
  .mountains {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: auto;
    z-index: 0;
    opacity: 0.95;
  }

  .ground-fade {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 90px;
    background: linear-gradient(180deg, rgba(244,251,255,0) 0%, var(--sky-bottom) 85%);
    z-index: 1;
    pointer-events: none;
  }

  .page {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 440px;
    padding: calc(48px + env(safe-area-inset-top, 0px)) 24px calc(56px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .badge {
    position: relative;
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: var(--snow);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 0 0 3px rgba(255,255,255,0.6),
      0 0 0 6px rgba(31,151,207,0.18),
      0 12px 30px rgba(18,58,92,0.25);
    margin-bottom: 26px;
  }
  .badge img {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    letter-spacing: 0.04em;
    font-size: clamp(1.9rem, 8.5vw, 2.5rem);
    margin: 0;
    line-height: 1.08;
    color: var(--navy);
  }

  .tagline {
    margin: 10px 0 2px;
    font-size: 0.98rem;
    color: var(--ice-soft);
    font-weight: 500;
  }

  .divider {
    width: 64px;
    height: 2px;
    margin: 22px 0 28px;
    background: linear-gradient(90deg, transparent, var(--ice), transparent);
    position: relative;
  }
  .divider::before {
    content: "❄";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 0.85rem;
    color: var(--ice);
    background: var(--sky-mid);
    padding: 0 8px;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 14px;
    text-decoration: none;
    color: var(--frost);
    background: rgba(255,255,255,0.72);
    border: 1px solid rgba(31,151,207,0.25);
    box-shadow: 0 6px 18px rgba(18,58,92,0.08);
    backdrop-filter: blur(6px);
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .link-card:hover,
  .link-card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--ice);
    background: rgba(255,255,255,0.92);
  }
  .link-card:focus-visible {
    outline: 2px solid var(--ice);
    outline-offset: 3px;
  }
  .link-card:active { transform: translateY(-1px); }

  .icon {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(31,151,207,0.1);
  }
  .icon svg { width: 22px; height: 22px; }

  .link-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.25;
  }
  .link-text .name {
    font-weight: 600;
    font-size: 1.02rem;
    color: var(--navy);
  }
  .link-text .sub {
    font-size: 0.82rem;
    color: var(--ice-soft);
  }

  footer {
    position: relative;
    z-index: 3;
    margin-top: 40px;
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(4px);
    font-size: 0.78rem;
    color: var(--navy);
    letter-spacing: 0.02em;
  }
</style>
</head>
